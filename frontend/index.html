<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosonografía — Cargando...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
    }

    .loader {
      text-align: center;
      color: white;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 2rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 1.2rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="loader-spinner"></div>
    <p class="loader-text">Iniciando Ecosonografía...</p>
  </div>

  <script>
    // Router simple basado en autenticación
    const token = localStorage.getItem('auth-token');

    if (token) {
      // Autenticado: redirigir a dashboard
      window.location.href = 'pages/dashboard.html';
    } else {
      // No autenticado: redirigir a login
      window.location.href = 'pages/login.html';
    }

    // Timeout de seguridad (5 segundos)
    setTimeout(() => {
      if (window.location.href.includes('index.html')) {
        console.error('Router: redirección falla. Forzando login.');
        window.location.href = 'pages/login.html';
      }
    }, 5000);
  </script>
</body>
</html>
