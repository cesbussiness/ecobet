<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Informe - Ecosonografía</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --accent: #14b8a6;
      --dark: #1e293b;
      --light: #f1f5f9;
      --border: #e2e8f0;
      --text: #475569;
    }

    * {
      font-family: 'Inter', sans-serif;
    }

    h1, h2 {
      font-family: 'Playfair Display', serif;
    }

    body {
      background: linear-gradient(135deg, #f1f5f9 0%, #e0f2fe 100%);
      min-height: 100vh;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .page-header {
      margin-bottom: 40px;
    }

    .page-header h1 {
      font-size: 44px;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text);
      font-size: 16px;
    }

    .form-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
      background: white;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--light);
      color: var(--dark);
      border: 2px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .form-actions button {
      flex: 1;
    }

    .ai-response {
      background: linear-gradient(135deg, #f0f4f8 0%, #e8f0f7 100%);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      max-height: 500px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }

    .ai-response h3 {
      margin-top: 0;
      color: var(--dark);
      font-size: 16px;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border-left: 4px solid #ef4444;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border-left: 4px solid #22c55e;
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .page-header h1 {
        font-size: 32px;
      }

      .form-card {
        padding: 20px;
      }

      .form-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>🏥 Ecosonografía</h1>
    </div>
    <ul class="nav-menu">
      <li><a href="dashboard.html">📊 Dashboard</a></li>
      <li><a href="pacientes.html">👥 Pacientes</a></li>
      <li><a href="nuevo-informe.html" class="active">📝 Nuevo Informe</a></li>
      <li><a href="historico.html">📚 Histórico</a></li>
      <li><a href="configuracion.html">⚙️ Configuración</a></li>
      <li><a href="#" onclick="logout(event)">🚪 Cerrar Sesión</a></li>
    </ul>
  </nav>

  <div class="content" id="content">
    <div class="page-header">
      <h1>📝 Nuevo Informe</h1>
      <p>Crea un informe de ecosonografía con análisis IA</p>
    </div>

    <div id="alert-container"></div>

    <div class="form-card">
      <h2 style="margin-top: 0; font-size: 24px;">Datos del Informe</h2>

      <div class="form-row">
        <div class="form-group">
          <label>Paciente *</label>
          <select id="paciente" required>
            <option value="">Seleccionar paciente...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Fecha del Informe *</label>
          <input type="date" id="fecha" required>
        </div>
      </div>

      <div class="form-group">
        <label>Tipo de Ecosonografía *</label>
        <select id="tipo" required>
          <option value="">Seleccionar tipo...</option>
          <option value="abdomen">Abdomen</option>
          <option value="obstetrica">Obstétrica</option>
          <option value="cardiaca">Cardíaca</option>
          <option value="vascular">Vascular</option>
          <option value="tiroidea">Tiroidea</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="form-group">
        <label>Hallazgos Clínicos *</label>
        
        <!-- AUDIOS INPUT -->
        <div style="margin-bottom: 16px; padding: 16px; background: #f0f4f8; border-radius: 10px; border: 2px dashed var(--border);">
          <label style="display: block; margin-bottom: 12px; font-weight: 600; color: var(--dark);">
            🎙️ Adjuntar Audios (opcional)
          </label>
          
          <input type="file" id="audio-input" accept="audio/*" multiple style="margin-bottom: 12px;">
          
          <div id="audio-list" style="margin-top: 12px;"></div>
          
          <button type="button" class="btn btn-secondary" onclick="transcribirAudios()" style="margin-top: 12px; width: 100%;">
            ✨ Transcribir Audios
          </button>
        </div>
        
        <textarea id="hallazgos" rows="6" placeholder="Describe los hallazgos o pega aquí la transcripción de los audios..." required></textarea>
      </div>

      <div class="form-group">
        <label>Observaciones Adicionales</label>
        <textarea id="observaciones" rows="4" placeholder="Cualquier nota adicional..."></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" onclick="generarInforme()" id="btn-generar">
          <span>✨ Generar Informe con IA</span>
        </button>
        <button class="btn btn-secondary" onclick="limpiarForm()">Limpiar</button>
      </div>
    </div>

    <div id="resultado-container"></div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    window.addEventListener('load', () => {
      console.log('✅ Página Nuevo Informe cargada');
      
      if (typeof layout !== 'undefined') {
        layout.init();
      }
      
      cargarPacientes();
      
      // Setear fecha de hoy
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('fecha').value = hoy;
    });

    function cargarPacientes() {
      console.log('📥 Cargando pacientes...');
      let pacientes = typeof storage !== 'undefined' ? storage.getPacientes() : [];
      console.log('📊 Total:', pacientes.length);
      
      const select = document.getElementById('paciente');
      
      pacientes.forEach(p => {
        const option = document.createElement('option');
        option.value = p.id;
        option.textContent = `${p.nombre} ${p.apellido || ''} (${p.cedula})`;
        select.appendChild(option);
      });
    }

    async function generarInforme() {
      console.log('✨ Generando informe con IA...');
      
      const pacienteId = document.getElementById('paciente').value;
      const fecha = document.getElementById('fecha').value;
      const tipo = document.getElementById('tipo').value;
      const hallazgos = document.getElementById('hallazgos').value;
      const observaciones = document.getElementById('observaciones').value;

      // Validar
      if (!pacienteId || !fecha || !tipo || !hallazgos) {
        mostrarAlerta('⚠️ Por favor completa todos los campos requeridos', 'error');
        return;
      }

      // Obtener datos paciente
      let pacientes = typeof storage !== 'undefined' ? storage.getPacientes() : [];
      let paciente = pacientes.find(p => p.id === pacienteId);
      
      if (!paciente) {
        mostrarAlerta('❌ Paciente no encontrado', 'error');
        return;
      }

      // Desabilitar botón
      const btn = document.getElementById('btn-generar');
      btn.disabled = true;

      try {
        // Llamar API de Netlify que usa Claude
        console.log('📡 Llamando API Claude...');
        
        const response = await fetch('/api/ai-process', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('auth-token')}`
          },
          body: JSON.stringify({
            paciente: {
              nombre: paciente.nombre,
              apellido: paciente.apellido,
              cedula: paciente.cedula,
              edad: paciente.edad,
              genero: paciente.genero
            },
            fecha: fecha,
            tipo: tipo,
            hallazgos: hallazgos,
            observaciones: observaciones
          })
        });

        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();
        console.log('✅ Respuesta IA:', data);

        // Mostrar resultado
        const resultado = data.analisis || data.resultado || 'Sin respuesta';
        mostrarResultado(resultado, paciente, fecha, tipo);

        // Guardar informe
        guardarInforme(paciente, fecha, tipo, hallazgos, resultado);

      } catch (error) {
        console.error('❌ Error:', error);
        mostrarAlerta('❌ Error al generar informe: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function mostrarAlerta(mensaje, tipo) {
      const container = document.getElementById('alert-container');
      const alert = document.createElement('div');
      alert.className = `alert alert-${tipo}`;
      alert.textContent = mensaje;
      container.innerHTML = '';
      container.appendChild(alert);
      
      setTimeout(() => {
        alert.remove();
      }, 5000);
    }

    function mostrarResultado(analisis, paciente, fecha, tipo) {
      const container = document.getElementById('resultado-container');
      
      const html = `
        <div class="form-card">
          <h2 style="margin-top: 0; font-size: 24px; color: var(--accent);">📋 Informe Generado</h2>
          
          <div style="margin-bottom: 20px; padding: 16px; background: var(--light); border-radius: 10px;">
            <p><strong>Paciente:</strong> ${paciente.nombre} ${paciente.apellido || ''}</p>
            <p><strong>Cédula:</strong> ${paciente.cedula}</p>
            <p><strong>Fecha:</strong> ${new Date(fecha).toLocaleDateString('es-ES')}</p>
            <p><strong>Tipo:</strong> ${tipo}</p>
          </div>

          <div class="ai-response">
            <h3>Análisis IA</h3>
            <div>${analisis.replace(/\n/g, '<br>')}</div>
          </div>

          <div class="form-actions" style="margin-top: 30px;">
            <button class="btn btn-primary" onclick="descargarPDF('${paciente.id}')">
              📥 Descargar PDF
            </button>
            <button class="btn btn-secondary" onclick="enviarEmail('${paciente.id}')">
              📧 Enviar por Email
            </button>
          </div>
        </div>
      `;
      
      container.innerHTML = html;
    }

    function guardarInforme(paciente, fecha, tipo, hallazgos, analisis) {
      console.log('💾 Guardando informe en localStorage...');
      
      const informe = {
        id: 'inf-' + Date.now(),
        pacienteId: paciente.id,
        paciente: paciente.nombre,
        fecha: fecha,
        tipo: tipo,
        hallazgos: hallazgos,
        analisis: analisis,
        createdAt: new Date().toISOString()
      };

      if (typeof storage !== 'undefined') {
        // Guardar en localStorage (próximo: supabase)
        let informes = JSON.parse(localStorage.getItem('ecosonografia_informes') || '[]');
        informes.push(informe);
        localStorage.setItem('ecosonografia_informes', JSON.stringify(informes));
        console.log('✅ Informe guardado');
      }

      mostrarAlerta('✅ Informe guardado exitosamente', 'success');
    }

    function descargarPDF(pacienteId) {
      alert('📥 Función PDF en desarrollo (próximo: integración pdfmake)');
    }

    function enviarEmail(pacienteId) {
      alert('📧 Función Email en desarrollo (próximo: integración Nodemailer)');
    }

    function limpiarForm() {
      document.getElementById('paciente').value = '';
      document.getElementById('tipo').value = '';
      document.getElementById('hallazgos').value = '';
      document.getElementById('observaciones').value = '';
      document.getElementById('resultado-container').innerHTML = '';
      document.getElementById('alert-container').innerHTML = '';
      
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('fecha').value = hoy;
    }


    let audiosAdjuntos = [];

    document.getElementById('audio-input').addEventListener('change', (e) => {
      audiosAdjuntos = Array.from(e.target.files);
      mostrarAudios();
    });

    function mostrarAudios() {
      const list = document.getElementById('audio-list');
      
      if (audiosAdjuntos.length === 0) {
        list.innerHTML = '';
        return;
      }

      list.innerHTML = audiosAdjuntos.map((audio, i) => `
        <div style="padding: 8px; background: white; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 12px;">
            🎵 ${audio.name} (${(audio.size / 1024).toFixed(1)} KB)
          </span>
          <button type="button" class="btn btn-small" onclick="eliminarAudio(${i})" style="background: #ef4444; color: white; padding: 4px 8px;">
            ✕
          </button>
        </div>
      `).join('');
    }

    function eliminarAudio(index) {
      audiosAdjuntos.splice(index, 1);
      document.getElementById('audio-input').value = '';
      mostrarAudios();
    }

    async function transcribirAudios() {
      if (audiosAdjuntos.length === 0) {
        mostrarAlerta('⚠️ No hay audios para transcribir', 'error');
        return;
      }

      console.log('🎙️ Transcribiendo', audiosAdjuntos.length, 'audio(s)...');

      let transcripcionCompleta = '';

      for (let i = 0; i < audiosAdjuntos.length; i++) {
        const audio = audiosAdjuntos[i];
        
        try {
          console.log('📡 Procesando audio', i + 1, 'de', audiosAdjuntos.length);
          
          // Convertir audio a base64
          const base64 = await leerArchivoBase64(audio);

          // Llamar API de transcripción
          const response = await fetch('/api/transcribe', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${localStorage.getItem('auth-token')}`
            },
            body: JSON.stringify({
              audioBase64: base64.split(',')[1],
              mimeType: audio.type
            })
          });

          if (!response.ok) {
            throw new Error(`Error: ${response.status}`);
          }

          const data = await response.json();
          console.log('✅ Audio', i + 1, 'transcrito');

          transcripcionCompleta += `[Audio ${i + 1}]
${data.transcripcion}

`;

        } catch (error) {
          console.error('❌ Error transcribiendo audio', i + 1, ':', error);
          mostrarAlerta('❌ Error transcribiendo audio ' + (i + 1), 'error');
          return;
        }
      }

      // Llenar campo de hallazgos con transcripción
      const hallazgosField = document.getElementById('hallazgos');
      hallazgosField.value = transcripcionCompleta + hallazgosField.value;
      
      mostrarAlerta('✅ Audios transcriptos y añadidos a hallazgos', 'success');
      console.log('✅ Todos los audios procesados');
    }

    function leerArchivoBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function logout(e) {
      e.preventDefault();
      localStorage.clear();
      window.location.href = '/pages/login.html';
    }
  </script>
</body>
</html>
