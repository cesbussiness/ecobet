<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosonografía — Ingreso</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--color-white);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      box-shadow: var(--shadow-xl);
      animation: slideInUp var(--transition-slow) ease-out;
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--space-2xl);
    }

    .login-logo {
      font-size: 3rem;
      margin-bottom: var(--space-md);
    }

    .login-title {
      font-size: var(--size-2xl);
      margin: 0;
      color: var(--color-text-dark);
    }

    .login-subtitle {
      font-size: var(--size-sm);
      color: var(--color-text-muted);
      margin-top: var(--space-sm);
    }

    .form-group {
      margin-bottom: var(--space-lg);
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: var(--space-sm);
      display: block;
    }

    .form-group input {
      width: 100%;
      padding: var(--space-md);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--size-base);
      transition: border-color var(--transition-fast);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: var(--space-md);
      background: var(--color-primary);
      color: var(--color-white);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--size-base);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-base);
    }

    .btn-login:hover {
      background: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-error {
      color: var(--color-error);
      font-size: var(--size-sm);
      margin-top: var(--space-sm);
      display: none;
    }

    .form-error.show {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: var(--space-lg);
      font-size: var(--size-sm);
      color: var(--color-text-muted);
    }

    .login-footer a {
      color: var(--color-primary);
      text-decoration: none;
    }

    .loading {
      position: relative;
      display: inline-block;
    }

    .loading::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      right: var(--space-md);
      top: 50%;
      transform: translateY(-50%);
    }

    @keyframes spin {
      to { transform: translateY(-50%) rotate(360deg); }
    }

    /* Mobile (< 480px) */
    @media (max-width: 479px) {
      .login-card {
        padding: var(--space-lg);
      }

      .login-logo {
        font-size: 2.5rem;
      }

      .login-title {
        font-size: var(--size-xl);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card slide-up">
      <div class="login-header">
        <div class="login-logo">🏥</div>
        <h1 class="login-title">Ecosonografía</h1>
        <p class="login-subtitle">Sistema de Informes Médicos</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input 
            type="text" 
            id="usuario" 
            name="usuario" 
            placeholder="admin"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="form-error" id="error-message"></div>

        <button 
          type="submit" 
          class="btn-login" 
          id="submit-btn"
        >
          Ingresar
        </button>
      </form>

      <div class="login-footer">
        <p>Credencial por defecto: <strong>admin</strong> / <strong>Ecos2026$Admin</strong></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');

      // Validar campos
      if (!usuario || !password) {
        errorDiv.textContent = 'Usuario y contraseña son requeridos';
        errorDiv.classList.add('show');
        return;
      }

      // Mostrar loading
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      submitBtn.textContent = 'Ingresando...';
      errorDiv.classList.remove('show');

      try {
        const response = await api.login(usuario, password);

        if (!response.token) {
          throw new Error('Respuesta inválida del servidor');
        }

        // Guardar autenticación
        layout.setAuthInfo(response.token, response.role, response.name);

        // Redirigir al dashboard
        setTimeout(() => {
          window.location.href = 'pages/dashboard.html';
        }, 300);
      } catch (error) {
        let message = 'Error al ingresar';
        if (error.message) {
          message = error.message;
        } else if (error.data && error.data.message) {
          message = error.data.message;
        }

        errorDiv.textContent = message;
        errorDiv.classList.add('show');
        console.error('Login error:', error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        submitBtn.textContent = 'Ingresar';
      }
    });

    // Auto-rellenar en desarrollo (opcional, comentar en producción)
    document.addEventListener('DOMContentLoaded', () => {
      if (process.env?.NODE_ENV !== 'production') {
        // document.getElementById('usuario').value = 'admin';
        // document.getElementById('password').value = 'Ecos2026$Admin';
      }
    });
  </script>
</body>
</html>
