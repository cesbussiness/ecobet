<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecosonografía — Ingreso</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e40af 50%, #0d9488 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      font-family: var(--font-body);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(96, 165, 250, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 15s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -30%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(13, 148, 136, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 20s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(30px); }
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.97) 0%, rgba(248, 250, 252, 0.97) 100%);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(30, 64, 175, 0.15);
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      animation: slideInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-logo {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      display: inline-block;
      animation: fadeIn 0.6s ease-out 0.2s backwards;
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 1.875rem;
      font-weight: 800;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeIn 0.6s ease-out 0.3s backwards;
    }

    .login-subtitle {
      font-size: var(--size-sm);
      color: var(--color-text-muted);
      margin-top: var(--space-sm);
      letter-spacing: 0.5px;
      animation: fadeIn 0.6s ease-out 0.4s backwards;
    }

    .form-group {
      margin-bottom: 1.5rem;
      animation: fadeIn 0.6s ease-out backwards;
    }

    .form-group:nth-child(1) { animation-delay: 0.5s; }
    .form-group:nth-child(2) { animation-delay: 0.6s; }

    .form-group label {
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: block;
      color: var(--color-text-dark);
      font-size: var(--size-sm);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem 1.25rem;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      font-size: var(--size-base);
      font-family: var(--font-body);
      background: linear-gradient(135deg, #ffffff 0%, rgba(240, 249, 255, 0.5) 100%);
      transition: all var(--transition-base);
    }

    .form-group input::placeholder {
      color: var(--color-text-muted);
      opacity: 0.7;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1), 0 10px 30px rgba(30, 64, 175, 0.15);
      background: var(--color-white);
      transform: translateY(-2px);
    }

    .form-error {
      color: var(--color-error);
      font-size: var(--size-sm);
      margin-top: var(--space-sm);
      display: none;
      padding: 0.75rem 1rem;
      background: rgba(220, 38, 38, 0.1);
      border-left: 3px solid var(--color-error);
      border-radius: var(--radius-md);
      animation: slideInUp 0.4s ease-out;
    }

    .form-error.show {
      display: block;
    }

    .btn-login {
      width: 100%;
      padding: 1rem 1.5rem;
      background: linear-gradient(135deg, #1e40af 0%, #2d5fc7 100%);
      color: var(--color-white);
      border: none;
      border-radius: var(--radius-lg);
      font-size: var(--size-base);
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(30, 64, 175, 0.2);
      animation: fadeIn 0.6s ease-out 0.7s backwards;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left var(--transition-base);
    }

    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(30, 64, 175, 0.3), 0 0 40px rgba(30, 64, 175, 0.1);
    }

    .btn-login:hover::before {
      left: 100%;
    }

    .btn-login:active {
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-login span {
      position: relative;
      z-index: 1;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: var(--size-sm);
      color: var(--color-text-muted);
      padding-top: 1.5rem;
      border-top: 1px solid rgba(30, 64, 175, 0.1);
      animation: fadeIn 0.6s ease-out 0.8s backwards;
    }

    .login-footer p {
      margin: 0.5rem 0;
    }

    .login-footer strong {
      color: var(--color-primary);
      font-weight: 700;
      font-family: var(--font-mono);
      background: rgba(30, 64, 175, 0.05);
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
    }

    /* Mobile (< 480px) */
    @media (max-width: 479px) {
      .login-card {
        padding: 2rem 1.5rem;
      }

      .login-logo {
        font-size: 2.5rem;
      }

      .login-title {
        font-size: 1.5rem;
      }

      body::before,
      body::after {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card fade-in">
      <div class="login-header">
        <div class="login-logo">🏥</div>
        <h1 class="login-title">Ecosonografía</h1>
        <p class="login-subtitle">Sistema Inteligente de Informes Médicos</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input 
            type="text" 
            id="usuario" 
            name="usuario" 
            placeholder="admin"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="form-error" id="error-message"></div>

        <button 
          type="submit" 
          class="btn-login" 
          id="submit-btn"
        >
          <span>Ingresar al Sistema</span>
        </button>
      </form>

      <div class="login-footer">
        <p>
          <strong>Demo:</strong> 
          <strong>admin</strong> / 
          <strong>Ecos2026$Admin</strong>
        </p>
        <p style="font-size: var(--size-xs); opacity: 0.7; margin-top: 1rem;">
          Ecosonografía © 2026 — Todos los derechos reservados
        </p>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');

      // Validar campos
      if (!usuario || !password) {
        errorDiv.textContent = 'Usuario y contraseña son requeridos';
        errorDiv.classList.add('show');
        return;
      }

      // Mostrar loading
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      submitBtn.textContent = 'Ingresando...';
      errorDiv.classList.remove('show');

      try {
        const response = await api.login(usuario, password);

        if (!response.token) {
          throw new Error('Respuesta inválida del servidor');
        }

        // Guardar autenticación
        layout.setAuthInfo(response.token, response.role, response.name);

        // Redirigir al dashboard
        setTimeout(() => {
          window.location.href = 'pages/dashboard.html';
        }, 300);
      } catch (error) {
        let message = 'Error al ingresar';
        if (error.message) {
          message = error.message;
        } else if (error.data && error.data.message) {
          message = error.data.message;
        }

        errorDiv.textContent = message;
        errorDiv.classList.add('show');
        console.error('Login error:', error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        submitBtn.textContent = 'Ingresar';
      }
    });

    // Auto-rellenar en desarrollo (opcional, comentar en producción)
    // En el navegador no existe process.env, así que omitimos esta verificación
  </script>
</body>
</html>
