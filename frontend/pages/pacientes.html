<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pacientes</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    /* GARANTIZAR QUE EL MODAL FUNCIONE */
    .modal {
      display: none !important;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex !important;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .form-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>🏥 Ecosonografía</h1>
    </div>
    <ul class="nav-menu">
      <li><a href="dashboard.html">📊 Dashboard</a></li>
      <li><a href="pacientes.html" class="active">👥 Pacientes</a></li>
      <li><a href="nuevo-informe.html">📝 Nuevo Informe</a></li>
      <li><a href="historico.html">📚 Histórico</a></li>
      <li><a href="configuracion.html">⚙️ Configuración</a></li>
      <li><a href="#" onclick="logout(event)">🚪 Cerrar Sesión</a></li>
    </ul>
  </nav>

  <div class="content" id="content">
    <div class="page-header">
      <h1>👥 Gestión de Pacientes</h1>
    </div>

    <button id="new-patient-btn" class="btn btn-large btn-primary">➕ Nuevo Paciente</button>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cédula</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Nuevo Paciente</h2>
        <button class="modal-close" type="button">✕</button>
      </div>
      <form id="form">
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" id="nombre" required>
        </div>
        <div class="form-group">
          <label>Apellido</label>
          <input type="text" id="apellido">
        </div>
        <div class="form-group">
          <label>Cédula *</label>
          <input type="text" id="cedula" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="telefono">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">💾 Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    let editando = null;

    // INIT
    window.addEventListener('load', () => {
      console.log('✅ Página cargada');
      
      // Init layout
      if (typeof layout !== 'undefined') {
        layout.init();
      }
      
      // Eventos
      document.getElementById('new-patient-btn').onclick = abrirModal;
      document.querySelector('.modal-close').onclick = cerrarModal;
      document.getElementById('form').onsubmit = guardar;
      
      // Cargar
      cargar();
    });

    function abrirModal() {
      console.log('📋 Abriendo modal');
      editando = null;
      document.getElementById('form').reset();
      document.getElementById('modal-title').textContent = 'Nuevo Paciente';
      document.getElementById('modal').classList.add('active');
    }

    function cerrarModal() {
      console.log('✕ Cerrando modal');
      document.getElementById('modal').classList.remove('active');
    }

    function cargar() {
      console.log('📥 Cargando...');
      let data = typeof storage !== 'undefined' ? storage.getPacientes() : [];
      console.log('📊 Total:', data.length);
      mostrar(data);
    }

    function mostrar(data) {
      const tbody = document.getElementById('tbody');
      
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">No hay pacientes</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(p => `
        <tr>
          <td>${p.nombre} ${p.apellido || ''}</td>
          <td>${p.cedula}</td>
          <td>${p.email || '—'}</td>
          <td>${p.telefono || '—'}</td>
          <td>
            <button class="btn btn-small btn-secondary" onclick="editar('${p.id}')">✎</button>
            <button class="btn btn-small btn-error" onclick="eliminar('${p.id}')">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function editar(id) {
      console.log('✏️ Editando:', id);
      let data = typeof storage !== 'undefined' ? storage.getPacientes() : [];
      let p = data.find(x => x.id === id);
      
      if (!p) {
        alert('No encontrado');
        return;
      }
      
      editando = id;
      document.getElementById('nombre').value = p.nombre;
      document.getElementById('apellido').value = p.apellido || '';
      document.getElementById('cedula').value = p.cedula;
      document.getElementById('email').value = p.email || '';
      document.getElementById('telefono').value = p.telefono || '';
      document.getElementById('modal-title').textContent = 'Editar Paciente';
      abrirModal();
    }

    function guardar(e) {
      e.preventDefault();
      
      const data = {
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        cedula: document.getElementById('cedula').value,
        email: document.getElementById('email').value,
        telefono: document.getElementById('telefono').value,
        esAdulto: true
      };

      if (!data.nombre || !data.cedula) {
        alert('⚠️ Nombre y Cédula requeridos');
        return;
      }

      try {
        console.log('💾 Guardando...');
        
        if (editando) {
          console.log('✏️ Actualizar:', editando);
          if (typeof storage !== 'undefined') {
            storage.updatePaciente(editando, data);
          }
          alert('✅ Actualizado');
        } else {
          console.log('➕ Crear');
          if (typeof storage !== 'undefined') {
            storage.addPaciente(data);
          }
          alert('✅ Creado');
        }
        
        cerrarModal();
        cargar();
        
      } catch (error) {
        console.error('❌ Error:', error);
        alert('Error: ' + error.message);
      }
    }

    function eliminar(id) {
      if (!confirm('¿Eliminar?')) return;
      
      console.log('🗑️ Eliminando:', id);
      if (typeof storage !== 'undefined') {
        storage.deletePaciente(id);
      }
      cargar();
    }

    function logout(e) {
      e.preventDefault();
      localStorage.clear();
      window.location.href = '/pages/login.html';
    }
  </script>
</body>
</html>
