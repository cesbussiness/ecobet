<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pacientes - Ecosonografía</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>🏥 Ecosonografía</h1>
      <button class="sidebar-toggle">☰</button>
    </div>
    <ul class="nav-menu">
      <li><a href="dashboard.html">📊 Dashboard</a></li>
      <li><a href="pacientes.html" class="active">👥 Pacientes</a></li>
      <li><a href="nuevo-informe.html">📝 Nuevo Informe</a></li>
      <li><a href="historico.html">📚 Histórico</a></li>
      <li><a href="configuracion.html">⚙️ Configuración</a></li>
      <li><a href="#" id="logout-btn">🚪 Cerrar Sesión</a></li>
    </ul>
  </nav>

  <div class="content" id="content">
    <div class="page-header">
      <h1>👥 Gestión de Pacientes</h1>
      <p>Administra los pacientes del sistema</p>
    </div>

    <!-- BÚSQUEDA -->
    <div class="search-section">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por nombre, cédula...">
      <button id="search-btn" class="btn btn-primary">🔍 Buscar</button>
    </div>

    <!-- NUEVO PACIENTE -->
    <button id="new-patient-btn" class="btn btn-large btn-primary">➕ Nuevo Paciente</button>

    <!-- TABLA -->
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cédula</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="pacientes-tbody">
          <tr><td colspan="5" style="text-align:center;padding:40px;">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="patient-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Nuevo Paciente</h2>
        <button type="button" class="modal-close" id="modal-close">✕</button>
      </div>
      <form id="patient-form">
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" id="p-nombre" required>
        </div>
        <div class="form-group">
          <label>Apellido</label>
          <input type="text" id="p-apellido">
        </div>
        <div class="form-group">
          <label>Cédula *</label>
          <input type="text" id="p-cedula" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="p-email">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="p-telefono">
        </div>
        <div class="form-group">
          <label>Fecha de Nacimiento</label>
          <input type="date" id="p-fecha">
        </div>
        <div class="form-group">
          <label>Género</label>
          <select id="p-genero">
            <option value="">— Seleccionar —</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="O">Otro</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">💾 Guardar</button>
          <button type="button" class="btn btn-secondary" id="form-close">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    let editingId = null;

    // INIT
    document.addEventListener('DOMContentLoaded', init);

    function init() {
      console.log('📄 Página Pacientes inicializada');
      
      // Layout
      if (typeof layout !== 'undefined') {
        layout.init();
      }
      
      // Eventos
      document.getElementById('new-patient-btn').addEventListener('click', openModal);
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('form-close').addEventListener('click', closeModal);
      document.getElementById('patient-form').addEventListener('submit', savePaciente);
      document.getElementById('search-btn').addEventListener('click', buscar);
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') buscar();
      });
      document.getElementById('logout-btn').addEventListener('click', logout);
      
      // Cargar pacientes
      cargarPacientes();
      
      console.log('✅ Eventos configurados');
    }

    // ========== FUNCIONES ==========

    function openModal() {
      console.log('📋 Abriendo modal');
      editingId = null;
      document.getElementById('patient-form').reset();
      document.getElementById('patient-modal').classList.add('active');
    }

    function closeModal() {
      console.log('✕ Cerrando modal');
      document.getElementById('patient-modal').classList.remove('active');
      editingId = null;
    }

    async function cargarPacientes() {
      try {
        console.log('📥 Cargando pacientes...');
        
        let pacientes = [];
        
        // Intentar API
        try {
          const res = await fetch('/api/patients', {
            headers: { 'Authorization': `Bearer ${localStorage.getItem('auth-token')}` }
          });
          if (res.ok) {
            const json = await res.json();
            pacientes = json.data || [];
            console.log('✅ API: ' + pacientes.length + ' pacientes');
          }
        } catch (e) {
          console.log('⚠️ API error: ' + e.message);
        }
        
        // Si no hay datos, usar localStorage
        if (pacientes.length === 0 && typeof storage !== 'undefined') {
          pacientes = storage.getPacientes();
          console.log('📚 localStorage: ' + pacientes.length + ' pacientes');
        }
        
        mostrarPacientes(pacientes);
        
      } catch (error) {
        console.error('❌ Error: ' + error);
      }
    }

    function mostrarPacientes(pacientes) {
      const tbody = document.getElementById('pacientes-tbody');
      
      if (!pacientes || pacientes.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align:center;padding:60px 20px;">
              <div style="font-size:48px;margin-bottom:20px;">👥</div>
              <p>No hay pacientes registrados</p>
            </td>
          </tr>
        `;
        console.log('📊 Tabla vacía');
        return;
      }

      tbody.innerHTML = pacientes.map(p => `
        <tr>
          <td><strong>${p.nombre || '—'}</strong> ${p.apellido || ''}</td>
          <td>${p.cedula || '—'}</td>
          <td>${p.email || '—'}</td>
          <td>${p.telefono || '—'}</td>
          <td>
            <button class="btn btn-small btn-secondary" onclick="editarPaciente('${p.id}')">✎</button>
            <button class="btn btn-small btn-error" onclick="eliminarPaciente('${p.id}')">🗑️</button>
          </td>
        </tr>
      `).join('');
      
      console.log('✅ ' + pacientes.length + ' pacientes en tabla');
    }

    function editarPaciente(id) {
      console.log('✏️ Editando: ' + id);
      
      let pacientes = typeof storage !== 'undefined' ? storage.getPacientes() : [];
      let paciente = pacientes.find(p => p.id === id);
      
      if (!paciente) {
        alert('❌ Paciente no encontrado');
        return;
      }
      
      editingId = id;
      document.getElementById('p-nombre').value = paciente.nombre || '';
      document.getElementById('p-apellido').value = paciente.apellido || '';
      document.getElementById('p-cedula').value = paciente.cedula || '';
      document.getElementById('p-email').value = paciente.email || '';
      document.getElementById('p-telefono').value = paciente.telefono || '';
      document.getElementById('p-fecha').value = paciente.fechaNacimiento || '';
      document.getElementById('p-genero').value = paciente.genero || '';
      
      openModal();
    }

    async function savePaciente(e) {
      e.preventDefault();
      
      const data = {
        nombre: document.getElementById('p-nombre').value,
        apellido: document.getElementById('p-apellido').value,
        cedula: document.getElementById('p-cedula').value,
        email: document.getElementById('p-email').value,
        telefono: document.getElementById('p-telefono').value,
        fechaNacimiento: document.getElementById('p-fecha').value,
        genero: document.getElementById('p-genero').value,
        esAdulto: true
      };

      if (!data.nombre || !data.cedula) {
        alert('⚠️ Nombre y Cédula requeridos');
        return;
      }

      try {
        console.log('💾 Guardando paciente...');
        
        if (editingId) {
          console.log('➡️ Actualizando...');
          // Actualizar en localStorage
          if (typeof storage !== 'undefined') {
            storage.updatePaciente(editingId, data);
          }
        } else {
          console.log('➕ Creando...');
          // Crear en localStorage
          if (typeof storage !== 'undefined') {
            storage.addPaciente(data);
          }
        }
        
        console.log('✅ Guardado');
        alert('✅ Paciente ' + (editingId ? 'actualizado' : 'creado'));
        
        closeModal();
        
        setTimeout(() => {
          cargarPacientes();
        }, 200);
        
      } catch (error) {
        console.error('❌ Error: ' + error);
        alert('❌ Error: ' + error.message);
      }
    }

    function eliminarPaciente(id) {
      if (!confirm('¿Eliminar paciente?')) return;
      
      console.log('🗑️ Eliminando: ' + id);
      
      if (typeof storage !== 'undefined') {
        storage.deletePaciente(id);
        console.log('✅ Eliminado');
        cargarPacientes();
      }
    }

    function buscar() {
      const query = document.getElementById('search-input').value.toLowerCase();
      
      if (!query) {
        cargarPacientes();
        return;
      }
      
      console.log('🔍 Buscando: ' + query);
      
      let pacientes = typeof storage !== 'undefined' ? storage.getPacientes() : [];
      let filtered = pacientes.filter(p => 
        (p.nombre && p.nombre.toLowerCase().includes(query)) ||
        (p.cedula && p.cedula.includes(query))
      );
      
      mostrarPacientes(filtered);
      console.log('✅ ' + filtered.length + ' resultados');
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/pages/login.html';
    }
  </script>
</body>
</html>
