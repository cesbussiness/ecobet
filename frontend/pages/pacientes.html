<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pacientes</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --accent: #14b8a6;
      --dark: #1e293b;
      --light: #f1f5f9;
      --border: #e2e8f0;
      --text: #475569;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f1f5f9 0%, #e0f2fe 100%);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .content {
      padding: 30px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* HEADER */
    .page-header {
      margin-bottom: 40px;
      animation: slideDown 0.5s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      color: var(--dark);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .page-header p {
      color: var(--text);
      font-size: 16px;
      font-weight: 300;
    }

    /* CONTROLES */
    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      margin-bottom: 30px;
      align-items: end;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      transition: all 0.3s;
      background: white;
    }

    .search-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .search-wrapper::before {
      content: "🔍";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
    }

    /* BOTONES */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: var(--light);
      color: var(--dark);
      border: 2px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
      border-color: var(--dark);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-edit {
      background: #3b82f6;
      color: white;
    }

    .btn-delete {
      background: #ef4444;
      color: white;
    }

    /* TABLA */
    .table-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border-bottom: 2px solid var(--border);
    }

    th {
      padding: 16px;
      text-align: left;
      font-weight: 600;
      color: var(--dark);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
    }

    tbody tr {
      transition: all 0.2s;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--text);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .empty-state p {
      font-size: 16px;
      margin: 0;
      color: var(--text);
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(30, 41, 59, 0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      animation: modalSlide 0.3s ease;
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 30px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--dark);
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: var(--text);
      padding: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      color: var(--dark);
      background: var(--light);
      border-radius: 8px;
    }

    .modal-body {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 30px;
    }

    .form-actions button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    @media (max-width: 768px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .page-header h1 {
        font-size: 32px;
      }

      .modal-content {
        max-width: 90%;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 12px 8px;
      }

      .btn {
        padding: 10px 16px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>🏥 Ecosonografía</h1>
    </div>
    <ul class="nav-menu">
      <li><a href="dashboard.html">📊 Dashboard</a></li>
      <li><a href="pacientes.html" class="active">👥 Pacientes</a></li>
      <li><a href="nuevo-informe.html">📝 Nuevo Informe</a></li>
      <li><a href="historico.html">📚 Histórico</a></li>
      <li><a href="configuracion.html">⚙️ Configuración</a></li>
      <li><a href="#" onclick="logout(event)">🚪 Cerrar Sesión</a></li>
    </ul>
  </nav>

  <div class="content" id="content">
    <div class="page-header">
      <h1>👥 Pacientes</h1>
      <p>Gestión integral de pacientes del sistema</p>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
      <div class="search-wrapper">
        <input type="text" id="search" placeholder="Buscar paciente...">
      </div>
      <button class="btn btn-primary" onclick="abrirModal()">➕ Nuevo Paciente</button>
    </div>

    <!-- TABLA -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cédula</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Género</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <div class="empty-state-icon">⏳</div>
                <p>Cargando pacientes...</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Nuevo Paciente</h2>
        <button class="modal-close" onclick="cerrarModal()">✕</button>
      </div>

      <div class="modal-body">
        <form id="form" onsubmit="guardar(event)">
          <div class="form-row">
            <div class="form-group">
              <label>Nombre *</label>
              <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
              <label>Apellido</label>
              <input type="text" id="apellido">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Cédula *</label>
              <input type="text" id="cedula" required>
            </div>
            <div class="form-group">
              <label>Género</label>
              <select id="genero">
                <option value="">Seleccionar...</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
                <option value="O">Otro</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email">
          </div>

          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="telefono">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Fecha de Nacimiento</label>
              <input type="date" id="fechaNacimiento">
            </div>
            <div class="form-group">
              <label>Edad</label>
              <input type="number" id="edad" min="0" max="150">
            </div>
          </div>

          <div class="form-group">
            <label>Notas</label>
            <textarea id="notas" rows="3" style="resize: vertical;"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    let editando = null;

    window.addEventListener('load', () => {
      console.log('✅ Página cargada');
      if (typeof layout !== 'undefined') layout.init();
      cargar();
    });

    function abrirModal() {
      console.log('📋 Abriendo modal');
      editando = null;
      document.getElementById('form').reset();
      document.getElementById('modal-title').textContent = 'Nuevo Paciente';
      document.getElementById('modal').classList.add('active');
    }

    function cerrarModal() {
      console.log('✕ Cerrando modal');
      document.getElementById('modal').classList.remove('active');
    }

    function cargar() {
      console.log('📥 Cargando pacientes...');
      let data = typeof storage !== 'undefined' ? storage.getPacientes() : [];
      console.log('📊 Total:', data.length, 'pacientes');
      mostrar(data);
    }

    function mostrar(data) {
      const tbody = document.getElementById('tbody');
      
      if (!data || data.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <div class="empty-state-icon">👥</div>
                <p>No hay pacientes registrados</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = data.map(p => `
        <tr>
          <td><strong>${p.nombre || '—'}</strong> ${p.apellido || ''}</td>
          <td>${p.cedula}</td>
          <td>${p.email || '—'}</td>
          <td>${p.telefono || '—'}</td>
          <td>${p.genero === 'M' ? '🚹' : p.genero === 'F' ? '🚺' : '—'}</td>
          <td>
            <button class="btn btn-small btn-edit" onclick="editar('${p.id}')">✎ Editar</button>
            <button class="btn btn-small btn-delete" onclick="eliminar('${p.id}')">🗑️</button>
          </td>
        </tr>
      `).join('');
      console.log('✅ Tabla con', data.length, 'filas');
    }

    function editar(id) {
      console.log('✏️ Editando:', id);
      let data = typeof storage !== 'undefined' ? storage.getPacientes() : [];
      let p = data.find(x => x.id === id);
      
      if (!p) return alert('No encontrado');
      
      editando = id;
      document.getElementById('nombre').value = p.nombre || '';
      document.getElementById('apellido').value = p.apellido || '';
      document.getElementById('cedula').value = p.cedula || '';
      document.getElementById('email').value = p.email || '';
      document.getElementById('telefono').value = p.telefono || '';
      document.getElementById('genero').value = p.genero || '';
      document.getElementById('fechaNacimiento').value = p.fechaNacimiento || '';
      document.getElementById('edad').value = p.edad || '';
      document.getElementById('notas').value = p.notas || '';
      document.getElementById('modal-title').textContent = 'Editar Paciente';
      abrirModal();
    }

    function guardar(e) {
      e.preventDefault();
      console.log('💾 Guardando...');
      
      const data = {
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        cedula: document.getElementById('cedula').value,
        email: document.getElementById('email').value,
        telefono: document.getElementById('telefono').value,
        genero: document.getElementById('genero').value,
        fechaNacimiento: document.getElementById('fechaNacimiento').value,
        edad: document.getElementById('edad').value,
        notas: document.getElementById('notas').value,
        esAdulto: true
      };

      if (!data.nombre || !data.cedula) {
        alert('⚠️ Nombre y Cédula requeridos');
        return;
      }

      try {
        if (editando) {
          console.log('✏️ UPDATE:', editando);
          if (typeof storage !== 'undefined') {
            storage.updatePaciente(editando, data);
          }
          alert('✅ Actualizado');
        } else {
          console.log('➕ CREATE');
          if (typeof storage !== 'undefined') {
            const resultado = storage.addPaciente(data);
            console.log('✅ Creado:', resultado);
          }
          alert('✅ Creado');
        }
        
        cerrarModal();
        setTimeout(() => cargar(), 100);
        
      } catch (error) {
        console.error('❌ Error:', error);
        alert('Error: ' + error.message);
      }
    }

    function eliminar(id) {
      if (!confirm('¿Eliminar paciente?')) return;
      
      console.log('🗑️ Eliminando:', id);
      if (typeof storage !== 'undefined') {
        storage.deletePaciente(id);
        cargar();
      }
    }

    function logout(e) {
      e.preventDefault();
      localStorage.clear();
      window.location.href = '/pages/login.html';
    }

    document.getElementById('search').addEventListener('keyup', () => {
      const query = document.getElementById('search').value.toLowerCase();
      let data = typeof storage !== 'undefined' ? storage.getPacientes() : [];
      
      if (!query) return mostrar(data);
      
      let filtered = data.filter(p => 
        (p.nombre && p.nombre.toLowerCase().includes(query)) ||
        (p.cedula && p.cedula.includes(query))
      );
      
      mostrar(filtered);
    });
  </script>
</body>
</html>
