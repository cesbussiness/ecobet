<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes — Ecosonografía</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    .pacientes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-lg);
      flex-wrap: wrap;
      gap: var(--space-lg);
    }

    .search-box {
      display: flex;
      gap: var(--space-md);
      flex: 1;
      min-width: 200px;
    }

    .search-box input {
      flex: 1;
      min-width: 150px;
    }

    .pacientes-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: var(--space-lg);
      background: var(--color-white);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .pacientes-table thead {
      background: var(--color-bg-lighter);
    }

    .pacientes-table th {
      padding: var(--space-md);
      text-align: left;
      font-weight: 600;
      color: var(--color-text-dark);
      border-bottom: 2px solid var(--color-border);
    }

    .pacientes-table td {
      padding: var(--space-md);
      border-bottom: 1px solid var(--color-border);
    }

    .pacientes-table tbody tr:hover {
      background: var(--color-bg-light);
    }

    .patient-name {
      font-weight: 600;
      color: var(--color-text-dark);
    }

    .patient-id {
      font-size: var(--size-sm);
      color: var(--color-text-muted);
    }

    .table-actions {
      display: flex;
      gap: var(--space-sm);
    }

    .btn-small {
      padding: var(--space-sm) var(--space-md);
      font-size: var(--size-sm);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--color-white);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      max-width: 500px;
      width: 100%;
      box-shadow: var(--shadow-xl);
      animation: slideInUp var(--transition-base) ease-out;
    }

    .modal-header {
      margin-bottom: var(--space-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--color-text-muted);
    }

    .empty-state {
      text-align: center;
      padding: var(--space-2xl);
      color: var(--color-text-muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: var(--space-md);
    }

    /* Mobile */
    @media (max-width: 767px) {
      .pacientes-header {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box input,
      .search-box button {
        width: 100%;
      }

      .pacientes-table {
        font-size: var(--size-sm);
      }

      .pacientes-table th,
      .pacientes-table td {
        padding: var(--space-sm);
      }

      .table-actions {
        flex-direction: column;
      }

      .btn-small {
        width: 100%;
      }

      .modal-content {
        padding: var(--space-lg);
      }
    }
  </style>
</head>
<body class="with-sidebar">
  <div class="content">
    <h1 style="margin-bottom: var(--space-lg);">Gestión de Pacientes</h1>

    <div class="pacientes-header">
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar por nombre, cédula..."
        >
        <button class="btn btn-secondary" id="search-btn">🔍 Buscar</button>
      </div>
      <button class="btn btn-primary" id="new-patient-btn">
        ➕ Nuevo Paciente
      </button>
    </div>

    <div id="table-container">
      <table class="pacientes-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cédula</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="pacientes-tbody">
          <tr>
            <td colspan="5" style="text-align: center; padding: var(--space-2xl);">
              Cargando pacientes...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal para nuevo/editar paciente -->
  <div class="modal" id="patient-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Nuevo Paciente</h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>

      <form id="patient-form">
        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" required>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido *</label>
          <input type="text" id="apellido" required>
        </div>

        <div class="form-group">
          <label for="cedula">Cédula *</label>
          <input type="text" id="cedula" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono">
        </div>

        <div class="form-group">
          <label for="fechaNacimiento">Fecha de Nacimiento</label>
          <input type="date" id="fechaNacimiento">
        </div>

        <div class="form-group">
          <label for="genero">Género</label>
          <select id="genero">
            <option value="">-- Seleccionar --</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="O">Otro</option>
          </select>
        </div>

        <div style="display: flex; gap: var(--space-md);">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" id="form-close">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    layout.setNav([
      {label: 'Dashboard', icon: '📊', href: 'dashboard.html'},
      {label: 'Nuevo Informe', icon: '📝', href: 'nuevo-informe.html'},
      {label: 'Pacientes', icon: '👥', href: 'pacientes.html', active: true},
      {label: 'Histórico', icon: '📋', href: 'historico.html'},
      {label: 'Configuración', icon: '⚙️', href: 'configuracion.html'}
    ]);

    let editingId = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadPacientes();
      setupEventListeners();
    });

    function setupEventListeners() {
      document.getElementById('new-patient-btn').addEventListener('click', openNewPatient);
      document.getElementById('patient-form').addEventListener('submit', savePaciente);
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('form-close').addEventListener('click', closeModal);
      document.getElementById('search-btn').addEventListener('click', searchPacientes);
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchPacientes();
      });
    }

    async function loadPacientes() {
      try {
        console.log('📥 Cargando pacientes...');
        
        let pacientes = [];
        try {
          const response = await api.getPacientes({limit: 1000});
          pacientes = response.data || [];
          console.log('✅ Desde API:', pacientes.length);
        } catch (apiError) {
          console.log('⚠️ API falló, usando localStorage...');
          pacientes = typeof storage !== 'undefined' ? storage.getPacientes() : [];
          console.log('✅ Desde localStorage:', pacientes.length);
        }
        
        renderPacientes(pacientes);
        console.log('✅ Tabla renderizada');
        
      } catch (error) {
        console.error('❌ Error fatal:', error);
      }
    }

    function renderPacientes(pacientes) {
      const tbody = document.getElementById('pacientes-tbody');
      
      console.log('🎨 Renderizando', pacientes?.length || 0, 'pacientes');
      
      if (!pacientes || pacientes.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="empty-state">
                <div class="empty-state-icon">👥</div>
                <p>No hay pacientes registrados</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = pacientes.map(p => `
        <tr>
          <td>
            <div class="patient-name">${p.nombre || '—'} ${p.apellido || ''}</div>
          </td>
          <td>
            <div class="patient-id">${p.cedula || '—'}</div>
          </td>
          <td>${p.email || '—'}</td>
          <td>${p.telefono || '—'}</td>
          <td>
            <div class="table-actions">
              <button class="btn btn-small btn-secondary" onclick="editPaciente('${p.id}')">
                ✎ Editar
              </button>
              <button class="btn btn-small btn-error" onclick="deletePaciente('${p.id}')">
                🗑️ Eliminar
              </button>
            </div>
          </td>
        </tr>
      `).join('');
      
      console.log('✅ Tabla renderizada con', pacientes.length, 'filas');
    }

    function closeModal() {
      const modal = document.getElementById('patient-modal');
      if (modal) {
        modal.classList.remove('active');
        console.log('✅ Modal cerrado');
      }
      editingId = null;
    }

    function searchPacientes() {
      const query = document.getElementById('search-input').value;
      if (!query) {
        loadPacientes();
        return;
      }
      // Implementar búsqueda en el backend
      loadPacientes();
    }
  </script>
</body>
</html>
