<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pacientes - Ecosonografía</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <!-- SIDEBAR + MOBILE HEADER -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>🏥 Ecosonografía</h1>
      <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
    </div>
    <ul class="nav-menu">
      <li><a href="dashboard.html">📊 Dashboard</a></li>
      <li><a href="pacientes.html" class="active">👥 Pacientes</a></li>
      <li><a href="nuevo-informe.html">📝 Nuevo Informe</a></li>
      <li><a href="historico.html">📚 Histórico</a></li>
      <li><a href="configuracion.html">⚙️ Configuración</a></li>
      <li><a href="#" id="logout-btn">🚪 Cerrar Sesión</a></li>
    </ul>
  </nav>

  <div class="content" id="content">
    <!-- MAIN CONTENT -->
    <div class="page-header">
      <h1>👥 Gestión de Pacientes</h1>
      <p>Administra los pacientes del sistema</p>
    </div>

    <!-- BÚSQUEDA -->
    <div class="search-section">
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Buscar por nombre, cédula..."
      >
      <button id="search-btn" class="btn btn-primary">🔍 Buscar</button>
    </div>

    <!-- BOTÓN NUEVO PACIENTE -->
    <button id="new-patient-btn" class="btn btn-large btn-primary">
      ➕ Nuevo Paciente
    </button>

    <!-- TABLA PACIENTES -->
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cédula</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="pacientes-tbody">
          <tr>
            <td colspan="5" style="text-align: center; padding: 60px 20px;">
              <div style="font-size: 48px; margin-bottom: 20px;">👥</div>
              <p>Cargando pacientes...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL PACIENTE -->
  <div class="modal" id="patient-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Nuevo Paciente</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>

      <form id="patient-form">
        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" required>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido">
        </div>

        <div class="form-group">
          <label for="cedula">Cédula *</label>
          <input type="text" id="cedula" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono">
        </div>

        <div class="form-group">
          <label for="fechaNacimiento">Fecha de Nacimiento</label>
          <input type="date" id="fechaNacimiento">
        </div>

        <div class="form-group">
          <label for="genero">Género</label>
          <select id="genero">
            <option value="">— Seleccionar —</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="O">Otro</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">💾 Guardar</button>
          <button type="button" class="btn btn-secondary" id="form-close">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    let editingId = null;

    // ========================================
    // INICIALIZACIÓN
    // ========================================
    document.addEventListener('DOMContentLoaded', () => {
      console.log('✅ Página Pacientes cargada');
      
      // Inicializar layout (hamburguesa)
      if (typeof layout !== 'undefined') {
        layout.init();
        console.log('✅ Layout inicializado (hamburguesa visible)');
      }
      
      // Cargar pacientes
      loadPacientes();
      
      // Setup eventos
      setupEventListeners();
      
      // Cerrar sesión
      document.getElementById('logout-btn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('authToken');
        window.location.replace('/pages/login.html');
      });
    });

    // ========================================
    // EVENT LISTENERS
    // ========================================
    function setupEventListeners() {
      const newBtn = document.getElementById('new-patient-btn');
      const form = document.getElementById('patient-form');
      const closeBtn = document.getElementById('modal-close');
      const cancelBtn = document.getElementById('form-close');
      const searchBtn = document.getElementById('search-btn');
      const searchInput = document.getElementById('search-input');

      if (newBtn) newBtn.addEventListener('click', openNewPatient);
      if (form) form.addEventListener('submit', savePaciente);
      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
      if (searchBtn) searchBtn.addEventListener('click', searchPacientes);
      if (searchInput) {
        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') searchPacientes();
        });
      }

      console.log('✅ Event listeners configurados');
    }

    // ========================================
    // ABRIR/CERRAR MODAL
    // ========================================
    function openNewPatient() {
      console.log('📋 Abriendo formulario nuevo paciente');
      editingId = null;
      document.getElementById('patient-form').reset();
      document.getElementById('modal-title').textContent = 'Nuevo Paciente';
      document.getElementById('patient-modal').classList.add('active');
    }

    function closeModal() {
      console.log('✕ Cerrando modal');
      document.getElementById('patient-modal').classList.remove('active');
      editingId = null;
    }

    // ========================================
    // CARGAR PACIENTES
    // ========================================
    async function loadPacientes() {
      try {
        console.log('📥 Cargando pacientes...');
        
        let pacientes = [];
        
        // Intentar API
        try {
          const response = await api.getPacientes({limit: 1000});
          pacientes = response.data || [];
          console.log('✅ Pacientes desde API:', pacientes.length);
        } catch (apiError) {
          console.log('⚠️ API no disponible, usando localStorage');
          if (typeof storage !== 'undefined') {
            pacientes = storage.getPacientes();
            console.log('✅ Pacientes desde localStorage:', pacientes.length);
          }
        }
        
        renderPacientes(pacientes);
        
      } catch (error) {
        console.error('❌ Error cargando pacientes:', error);
        document.getElementById('pacientes-tbody').innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; padding: 20px;">
              ❌ Error al cargar pacientes
            </td>
          </tr>
        `;
      }
    }

    // ========================================
    // RENDERIZAR TABLA
    // ========================================
    function renderPacientes(pacientes) {
      const tbody = document.getElementById('pacientes-tbody');
      
      console.log('🎨 Renderizando', pacientes?.length || 0, 'pacientes');
      
      if (!pacientes || pacientes.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; padding: 60px 20px;">
              <div style="font-size: 48px; margin-bottom: 20px;">👥</div>
              <p>No hay pacientes registrados</p>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = pacientes.map(p => `
        <tr>
          <td>
            <strong>${p.nombre || '—'}</strong>
            ${p.apellido ? ` ${p.apellido}` : ''}
          </td>
          <td>${p.cedula || '—'}</td>
          <td>${p.email || '—'}</td>
          <td>${p.telefono || '—'}</td>
          <td>
            <button class="btn btn-small btn-secondary" onclick="editarPaciente('${p.id}')">
              ✎ Editar
            </button>
            <button class="btn btn-small btn-error" onclick="eliminarPaciente('${p.id}')">
              🗑️ Eliminar
            </button>
          </td>
        </tr>
      `).join('');
      
      console.log('✅ Tabla renderizada');
    }

    // ========================================
    // EDITAR PACIENTE
    // ========================================
    function editarPaciente(id) {
      console.log('✏️ Editando paciente:', id);
      
      try {
        let paciente = null;
        
        // Buscar en API o localStorage
        if (typeof storage !== 'undefined') {
          const pacientes = storage.getPacientes();
          paciente = pacientes.find(p => p.id === id);
        }
        
        if (!paciente) {
          alert('❌ Paciente no encontrado');
          return;
        }
        
        // Llenar formulario
        editingId = id;
        document.getElementById('nombre').value = paciente.nombre || '';
        document.getElementById('apellido').value = paciente.apellido || '';
        document.getElementById('cedula').value = paciente.cedula || '';
        document.getElementById('email').value = paciente.email || '';
        document.getElementById('telefono').value = paciente.telefono || '';
        document.getElementById('fechaNacimiento').value = paciente.fechaNacimiento || '';
        document.getElementById('genero').value = paciente.genero || '';
        
        document.getElementById('modal-title').textContent = 'Editar Paciente';
        document.getElementById('patient-modal').classList.add('active');
        
      } catch (error) {
        console.error('Error editando:', error);
        alert('Error: ' + error.message);
      }
    }

    // ========================================
    // GUARDAR PACIENTE
    // ========================================
    async function savePaciente(e) {
      e.preventDefault();
      
      const data = {
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        cedula: document.getElementById('cedula').value,
        email: document.getElementById('email').value,
        telefono: document.getElementById('telefono').value,
        fechaNacimiento: document.getElementById('fechaNacimiento').value,
        genero: document.getElementById('genero').value,
        esAdulto: true
      };

      // Validar
      if (!data.nombre || !data.cedula) {
        alert('⚠️ Nombre y Cédula son requeridos');
        return;
      }

      try {
        console.log('💾 Guardando paciente...');
        
        if (editingId) {
          // ACTUALIZAR
          console.log('✏️ Actualizando:', editingId);
          await api.updatePaciente(editingId, data);
          console.log('✅ Paciente actualizado');
          alert('✅ Paciente actualizado');
        } else {
          // CREAR
          console.log('➕ Creando nuevo paciente');
          await api.createPaciente(data);
          console.log('✅ Paciente creado');
          alert('✅ Paciente creado');
        }
        
        closeModal();
        
        // Esperar y recargar
        await new Promise(r => setTimeout(r, 300));
        await loadPacientes();
        
      } catch (error) {
        console.error('❌ Error guardando:', error);
        alert('❌ Error: ' + (error.message || error));
      }
    }

    // ========================================
    // ELIMINAR PACIENTE
    // ========================================
    async function eliminarPaciente(id) {
      if (!confirm('¿Estás seguro de que deseas eliminar este paciente?')) {
        return;
      }

      try {
        console.log('🗑️ Eliminando paciente:', id);
        await api.deletePaciente(id);
        console.log('✅ Paciente eliminado');
        alert('✅ Paciente eliminado');
        loadPacientes();
      } catch (error) {
        console.error('Error eliminando:', error);
        alert('Error: ' + error.message);
      }
    }

    // ========================================
    // BUSCAR PACIENTES
    // ========================================
    function searchPacientes() {
      const query = document.getElementById('search-input').value.toLowerCase();
      
      if (!query) {
        loadPacientes();
        return;
      }

      try {
        console.log('🔍 Buscando:', query);
        
        let pacientes = [];
        if (typeof storage !== 'undefined') {
          pacientes = storage.getPacientes();
        }
        
        const filtered = pacientes.filter(p => 
          (p.nombre && p.nombre.toLowerCase().includes(query)) ||
          (p.cedula && p.cedula.includes(query)) ||
          (p.apellido && p.apellido.toLowerCase().includes(query))
        );
        
        renderPacientes(filtered);
        console.log('✅ Búsqueda completada:', filtered.length, 'resultados');
        
      } catch (error) {
        console.error('Error buscando:', error);
      }
    }
  </script>
</body>
</html>
