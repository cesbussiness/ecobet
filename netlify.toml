# =====================================================================
# Configuración Netlify — Sistema de Informes de Ecosonografía
# Microservicios (Netlify Functions) + Frontend estático
# =====================================================================

[build]
  publish = "frontend"
  functions = "netlify/functions"

# Variables de entorno (configurar en Netlify Site settings)
[build.environment]
  NODE_VERSION = "18"

# Redirecciones de API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/pages/*"
  to = "/pages/index.html"
  status = 200

# Headers de CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Excluir respaldos de build
[context.production]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- _respaldos/"
